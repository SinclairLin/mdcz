name: Build & Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yaml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - name: Validate release version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          node --input-type=module - "$VERSION" <<'NODE'
          import { readFile } from "node:fs/promises";
          for (const path of ["package.json", "apps/desktop/package.json"]) {
            const manifest = JSON.parse(await readFile(path, "utf8"));
            if (manifest.version !== process.argv[2]) throw new Error(`${path} version does not match the release tag`);
          }
          NODE
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: [checks, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            script: build:linux
            artifact: desktop-linux
            glob: |
              release/*/*.AppImage
              release/*/latest-linux.yml
          - os: windows-latest
            script: build:win
            artifact: desktop-windows
            glob: |
              release/*/*-setup.exe
              release/*/*-setup.exe.blockmap
              release/*/*-portable.zip
              release/*/latest.yml
          - os: macos-latest
            script: build:mac
            artifact: desktop-macos
            glob: "release/*/*.dmg"
          - os: ubuntu-latest
            script: package:webui
            artifact: webui-portable
            glob: "release/mdcz-*.tar.gz"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build
        run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MDCZ_RELEASE_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          path: ${{ matrix.glob }}
          if-no-files-found: error
          retention-days: 1

  docker:
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read image repository
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MDCZ_RELEASE_VERSION=${{ needs.version.outputs.version }}
            MDCZ_REVISION=${{ github.sha }}
          tags: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
          cache-from: type=gha,scope=pr-166-image
          cache-to: type=gha,scope=pr-166-image,mode=max
      - name: Inspect published image
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE"

  release:
    needs: [version, build, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        run: |
          cd dist
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: MDCz ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          overwrite_files: true
          files: dist/**/*
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote latest release image
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LATEST_TAG=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$GITHUB_REF_NAME" = "$LATEST_TAG" ]; then
            IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"
          fi
