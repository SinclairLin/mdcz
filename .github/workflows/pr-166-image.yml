name: PR 166 Docker preview

on:
  push:
    branches: [build/pr-166-image]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pr-166-image
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/sinclairlin/mdcz:pr-166-d18791d3
    steps:
      - uses: actions/checkout@v7
        with:
          repository: SinclairLin/mdcz
          ref: d18791d3ee4ec4c26844c34459a930c575897912
          persist-credentials: false

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build amd64 image for smoke tests
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          load: true
          tags: mdcz:pr-166-smoke
          build-args: |
            MDCZ_RELEASE_VERSION=pr-166-d18791d3
            MDCZ_REVISION=d18791d3ee4ec4c26844c34459a930c575897912
          cache-from: type=gha,scope=pr-166-image
          cache-to: type=gha,scope=pr-166-image,mode=max

      - name: Verify identity, startup, database and shutdown
        run: sh docker/test-identity.sh
        env:
          MDCZ_DOCKER_SKIP_BUILD: "1"
          MDCZ_DOCKER_TEST_IMAGE: mdcz:pr-166-smoke

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-platform preview
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            MDCZ_RELEASE_VERSION=pr-166-d18791d3
            MDCZ_REVISION=d18791d3ee4ec4c26844c34459a930c575897912
          cache-from: type=gha,scope=pr-166-image
          cache-to: type=gha,scope=pr-166-image,mode=max

      - name: Inspect published image
        run: docker buildx imagetools inspect "$IMAGE"
